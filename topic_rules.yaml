# topic_rules.yaml — weak-labeling rules for topic_seed
#
# How it's applied (implement in clean/build_corpus.py):
#   1. Match card_text (content-first) with strong_keywords (≥1 hit) or keywords (≥2 hits).
#      If no content label, fall back to study-title matching (≥1 hit in either list).
#   2. All matching is case-insensitive; "re:" prefix marks a regex, otherwise exact substring.
#   3. Rules evaluated top to bottom; FIRST topic to reach threshold wins.
#   4. No match => topic_seed: unlabeled (excluded from training).
#   5. These produce label_source=weak ONLY. Gold labels are always hand-made.
#
# Removed (2026-07-11): digital_health, wait_times, funding, primary_care —
#   cross-cutting themes, reserved for multi-label extension (see decisions.md).

topics:
  - code: indigenous_health
    name: Indigenous health
    keywords:
      - indigenous
    strong_keywords:
      - indigenous health
      - first nations
      - inuit
      - "re:\\bmétis|\\bmetis\\b"
      - jordan's principle
      - non-insured health benefits

  - code: womens_health
    name: Women's and reproductive health
    strong_keywords:
      - women's health
      - womens health
      - reproductive health
      - maternal health
      - breast cancer
      - cervical cancer
      - menopause
      - endometriosis
      - contraception
      - midwifery

  - code: mental_health
    name: Mental health and substance use
    keywords:
      - mental health
      - mental illness
      - substance use
      - addiction
    strong_keywords:
      - opioid
      - overdose
      - suicide prevention

  - code: public_health
    name: Public health and pandemic preparedness
    keywords:
      - public health
      - pandemic
      - epidemic
      - "re:\\bcovid"
      - infectious disease
      - communicable disease
      - outbreak
      - "re:\\bvaccin"
    strong_keywords:
      - pandemic preparedness
      - emergency preparedness
      - antimicrobial
      - immunization
      - immunisation
      - disease surveillance
      - long covid

  - code: pharmacare
    name: Pharmacare, drugs and medical devices
    keywords:
      - pharmaceutical
      - prescription drug
      - drug coverage
      - drug pricing
      - drug shortage
      - drug approval
      - drug safety
    strong_keywords:
      - pharmacare
      - patented medicine
      - formulary
      - rare disease drug
      - biosimilar
      - medical device

  - code: workforce
    name: Health workforce
    keywords:
      - workforce
      - burnout
      - retention and recruitment
    strong_keywords:
      - physician shortage
      - nurse shortage
      - nursing shortage
      - health human resources
      - credential recognition
      - internationally educated
      - internationally trained
      - scope of practice

  - code: childrens_health
    name: Children's and paediatric health
    keywords:
      - children's health
      - childrens health
      - child health
    strong_keywords:
      - "re:\\bpaediatric|\\bpediatric"
      - "re:\\bneonatal"
      - "re:\\binfant health"

  - code: cancer
    name: Cancer prevention and treatment
    strong_keywords:
      - cancer prevention
      - cancer treatment
      - cancer care
      - oncology
      - "re:\\bchemo"
      - radiation therapy
      - cancer screening
      - carcinogen

fallback: unlabeled

# Studies where the study title is too broad to assign a topic directly.
# For these, keyword matching falls through to the brief's own text.
title_exempt_studies:
  - "Emergency Situation Facing Canadians in Light of the COVID-19 Pandemic"
  - "Impact of Immigration Policy on Healthcare and Barriers to Integrating Internationally Trained Professionals"
  - "Children's Health"
