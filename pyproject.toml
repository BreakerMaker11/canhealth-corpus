[project]
name = "canhealth-corpus"
version = "0.1.0"
description = "Scraping and cleaning pipeline for Canadian health-policy documents"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "pymupdf>=1.24",
    "langdetect>=1.0",
    "pandas>=2.2",
    "lxml>=5.2",
]

[tool.uv]
dev-dependencies = ["pytest>=8", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scrape", "clean", "qa"]
